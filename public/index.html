<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🦆 Утиная ферма | Тапалка</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1a7f3e 0%, #0a4a1f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
        }

        .game-container {
            max-width: 550px;
            width: 100%;
            background: #fef5e6;
            border-radius: 48px;
            padding: 16px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid #ffd966;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            background: #2d2b1f;
            border-radius: 60px;
            padding: 8px 16px;
            margin-bottom: 16px;
            color: #ffd966;
            font-weight: bold;
        }

        .stat {
            background: #1e1c15;
            padding: 5px 15px;
            border-radius: 40px;
            font-size: 1.1rem;
        }

        .duck-area {
            text-align: center;
            margin: 10px 0;
        }

        .duck {
            font-size: 150px;
            cursor: pointer;
            transition: transform 0.08s linear;
            filter: drop-shadow(8px 12px 0 rgba(0, 0, 0, 0.2));
            display: inline-block;
        }

        .duck:active {
            transform: scale(0.92);
        }

        .energy-bar {
            background: #3a2c1c;
            border-radius: 30px;
            height: 14px;
            width: 90%;
            margin: 10px auto;
            overflow: hidden;
        }

        .energy-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f7b42c, #fcff6e);
            transition: width 0.1s linear;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin: 15px 0 10px;
        }

        .tab-btn {
            flex: 1;
            background: #e8dcc8;
            border: none;
            padding: 10px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: none;
            transform: none;
        }

        .tab-btn.active {
            background: #f5b642;
            color: white;
            box-shadow: 0 2px 0 #a4661a;
        }

        .tab-btn:active {
            transform: none;
        }

        .panel {
            display: none;
            background: #fdf8e7;
            border-radius: 32px;
            padding: 12px;
            margin-top: 8px;
            max-height: 320px;
            overflow-y: auto;
        }

        .panel.active {
            display: block;
        }

        .item-card {
            background: #fff1da;
            border-radius: 24px;
            padding: 10px 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .item-name {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            background: #f5b642;
            border: none;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 2px 0 #a4661a;
            transition: 0.05s linear;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0 #a4661a;
        }

        button:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .badge {
            background: #f5cd94;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.75rem;
        }

        .passive-info {
            font-size: 0.7rem;
            color: #7a5a2a;
            margin-top: 8px;
            text-align: center;
        }

        footer {
            text-align: center;
            font-size: 0.65rem;
            margin-top: 12px;
            color: #8b6b3a;
        }

        .bonus-info {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 5px;
            color: #2d6a4f;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <!-- Панель ресурсов -->
        <div class="stats">
            <div class="stat">🪙 <span id="score">0</span></div>
            <div class="stat">⚡ <span id="energyVal">100</span></div>
            <div class="stat">🐣 <span id="eggCount">0</span></div>
        </div>

        <!-- Утка -->
        <div class="duck-area">
            <div class="duck" id="duck">🦆</div>
            <div class="energy-bar">
                <div class="energy-fill" id="energyFill"></div>
            </div>
        </div>

        <!-- Табы -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="tap">🚀 Тапалка</button>
            <button class="tab-btn" data-tab="eggs">🥚 Яйца</button>
            <button class="tab-btn" data-tab="ducks">🦆 Мои утки</button>
            <button class="tab-btn" data-tab="shop">🏪 Магазин</button>
        </div>

        <!-- Панель тапалки (задания + бонус) -->
        <div id="tapPanel" class="panel active">
            <div class="section-title">📋 Задания</div>
            <div id="tasks-container">
                <div class="item-card" id="task-subscribe">
                    <span>📢 Подписаться на канал</span>
                    <button id="subscribeBtn">➕ +30 энергии</button>
                </div>
            </div>

            <!-- Ежедневный бонус -->
            <div class="item-card" id="dailyBonusCard">
                <span>🎁 Ежедневный бонус</span>
                <button id="dailyBonusBtn">Забрать</button>
            </div>
            <div id="bonusInfo" class="bonus-info"></div>

            <div class="passive-info">
                💰 Пассивный доход: <span id="passiveIncome">0</span> монет/сек
            </div>
        </div>

        <!-- Панель яиц -->
        <div id="eggsPanel" class="panel">
            <div class="section-title">🥚 Инкубатор</div>
            <div id="eggsList"></div>
        </div>

        <!-- Панель коллекции уток -->
        <div id="ducksPanel" class="panel">
            <div class="section-title">🦆 Ваша ферма</div>
            <div id="ducksList"></div>
            <button id="mergeDucksBtn" style="width:100%; margin-top:10px;">🔄 Объединить двух обычных уток → 🦢
                Редкая</button>
        </div>

        <!-- Панель магазина -->
        <div id="shopPanel" class="panel">
            <div class="section-title">🛒 Магазин</div>
            <div class="item-card">
                <span>🍎 +20 энергии</span>
                <button id="buyEnergyBtn">25 🪙</button>
            </div>
            <div class="item-card">
                <span>⚡ Множитель x2 (навсегда)</span>
                <button id="buyMultiplierBtn">150 🪙</button>
            </div>
            <div class="item-card">
                <span>🥚 Яйцо (вылупить утку)</span>
                <button id="buyEggBtn">50 🪙</button>
            </div>
        </div>
        <footer>Кликай по утке ⬇️ | Шанс найти яйцо — 10%</footer>
    </div>

    <script>
        // ---------- ИГРОВОЕ СОСТОЯНИЕ ----------
        let coins = 0;
        let energy = 100;
        const MAX_ENERGY = 100;
        let clickMultiplier = 1;
        let eggs = 0;
        let ducks = { common: 0, rare: 0 };
        let tasks = { subscribe: false };
        let bonusStreak = 0;
        let lastBonusDate = null;

        // Telegram ID (серверное сохранение)
        let telegramId = null;

        // ---------- ПОЛУЧЕНИЕ TELEGRAM ID ----------
        if (window.Telegram && window.Telegram.WebApp) {
            const webApp = window.Telegram.WebApp;
            webApp.ready();
            telegramId = webApp.initDataUnsafe.user?.id.toString();
        }
        if (!telegramId) {
            telegramId = 'test_' + Math.random().toString(36).substr(2, 9);
            console.log('Тестовый режим, ID:', telegramId);
        }

        // ---------- СЕРВЕРНЫЕ ФУНКЦИИ ----------
        async function loadFromServer() {
            try {
                const response = await fetch(`/api/player/${telegramId}`);
                const data = await response.json();
                coins = data.coins || 0;
                energy = data.energy !== undefined ? data.energy : 100;
                clickMultiplier = data.clickMultiplier || 1;
                eggs = data.eggs || 0;
                ducks = data.ducks || { common: 0, rare: 0 };
                tasks = data.tasks || { subscribe: false };
                lastBonusDate = data.lastBonusDate || null;
                bonusStreak = data.bonusStreak || 0;
                updateUI();
                updateBonusUI();
            } catch (e) {
                console.error('Ошибка загрузки с сервера:', e);
                // fallback на localStorage
                loadGameLocal();
            }
        }

        async function saveToServer() {
            try {
                await fetch(`/api/player/${telegramId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ coins, energy, clickMultiplier, eggs, ducks, tasks })
                });
            } catch (e) {
                console.error('Ошибка сохранения на сервер:', e);
                saveGameLocal();
            }
        }

        async function claimDailyBonus() {
            try {
                const response = await fetch(`/api/daily-bonus/${telegramId}`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    coins += data.reward;
                    bonusStreak = data.streak;
                    updateUI();
                    updateBonusUI();
                    saveToServer();
                    showToast(`🎉 Бонус: +${data.reward} монет! Серия: ${data.streak} дней`);
                } else {
                    showToast(data.message || 'Бонус уже получен сегодня');
                }
            } catch (e) {
                console.error('Ошибка бонуса:', e);
                showToast('Ошибка сервера, попробуйте позже');
            }
        }

        function updateBonusUI() {
            const bonusInfo = document.getElementById('bonusInfo');
            if (bonusInfo) {
                const nextBonus = 50 + (bonusStreak || 0) * 10;
                bonusInfo.innerHTML = `🔥 Серия: ${bonusStreak || 0} дней | Завтра: ${nextBonus} монет`;
            }
        }

        // ---------- ЛОКАЛЬНОЕ СОХРАНЕНИЕ (FALLBACK) ----------
        function loadGameLocal() {
            const saved = localStorage.getItem('duck_farm');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    coins = data.coins || 0;
                    energy = data.energy !== undefined ? Math.min(MAX_ENERGY, data.energy) : 100;
                    clickMultiplier = data.clickMultiplier || 1;
                    eggs = data.eggs || 0;
                    ducks = data.ducks || { common: 0, rare: 0 };
                    tasks = data.tasks || { subscribe: false };
                } catch (e) { }
            }
            updateUI();
        }

        function saveGameLocal() {
            const data = { coins, energy, clickMultiplier, eggs, ducks, tasks };
            localStorage.setItem('duck_farm', JSON.stringify(data));
        }

        // ---------- ПАССИВНЫЙ ДОХОД ----------
        function calculatePassiveIncome() {
            return ducks.common * 0.2 + ducks.rare * 0.8;
        }

        let passiveInterval = null;
        function startPassiveIncome() {
            if (passiveInterval) clearInterval(passiveInterval);
            passiveInterval = setInterval(() => {
                let income = calculatePassiveIncome();
                if (income > 0) {
                    coins += income;
                    updateUI();
                    saveToServer();
                    const scoreEl = document.getElementById('score');
                    if (scoreEl) {
                        scoreEl.style.transform = 'scale(1.1)';
                        setTimeout(() => { if (scoreEl) scoreEl.style.transform = ''; }, 150);
                    }
                }
            }, 1000);
        }

        // ---------- ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ----------
        function updateUI() {
            document.getElementById('score').innerText = Math.floor(coins);
            document.getElementById('energyVal').innerText = Math.floor(energy);
            document.getElementById('eggCount').innerText = eggs;

            const percent = (energy / MAX_ENERGY) * 100;
            document.getElementById('energyFill').style.width = percent + '%';

            const duckEmoji = document.getElementById('duck');
            if (energy <= 0) duckEmoji.innerText = '😴';
            else duckEmoji.innerText = clickMultiplier > 1 ? '🐔⚡' : '🦆';

            const passiveIncome = calculatePassiveIncome();
            document.getElementById('passiveIncome').innerText = passiveIncome.toFixed(1);

            const subBtn = document.getElementById('subscribeBtn');
            if (tasks.subscribe) {
                subBtn.disabled = true;
                subBtn.innerText = '✅ Выполнено';
            } else {
                subBtn.disabled = false;
                subBtn.innerText = '➕ +30 энергии';
            }

            renderEggsPanel();
            renderDucksPanel();
        }

        function renderEggsPanel() {
            const container = document.getElementById('eggsList');
            if (!container) return;
            if (eggs === 0) {
                container.innerHTML = '<div class="item-card">🥚 Нет яиц. Кликай по утке — с вероятностью 10% найдёшь яйцо!</div>';
                return;
            }
            container.innerHTML = `
            <div class="item-card">
                <div class="item-name">🥚 Обычное яйцо x${eggs}</div>
                <button id="hatchEggBtn">🐣 Вылупить (1 яйцо)</button>
            </div>
        `;
            const hatchBtn = document.getElementById('hatchEggBtn');
            if (hatchBtn) hatchBtn.onclick = () => hatchEgg();
        }

        function renderDucksPanel() {
            const container = document.getElementById('ducksList');
            if (!container) return;
            let html = '';
            if (ducks.common > 0) {
                html += `<div class="item-card"><span>🦆 Обычная утка x${ducks.common}</span><span class="badge">+${(ducks.common * 0.2).toFixed(1)}/сек</span></div>`;
            }
            if (ducks.rare > 0) {
                html += `<div class="item-card"><span>🦢 Редкая утка x${ducks.rare}</span><span class="badge">+${(ducks.rare * 0.8).toFixed(1)}/сек</span></div>`;
            }
            if (ducks.common === 0 && ducks.rare === 0) {
                html = '<div class="item-card">🐤 Пока нет уток. Получи яйцо и вылупи первую!</div>';
            }
            container.innerHTML = html;
        }

        function hatchEgg() {
            if (eggs <= 0) return;
            eggs--;
            const isRare = Math.random() < 0.2;
            if (isRare) {
                ducks.rare++;
                showToast('✨ Вылупилась РЕДКАЯ утка! +0.8 монет/сек ✨');
            } else {
                ducks.common++;
                showToast('🐥 Вылупилась обычная утка! +0.2 монет/сек');
            }
            updateUI();
            saveToServer();
        }

        function mergeDucks() {
            if (ducks.common >= 2) {
                ducks.common -= 2;
                ducks.rare++;
                showToast('🔄 Объединение успешно! Вы получили РЕДКУЮ утку!');
                updateUI();
                saveToServer();
            } else {
                alert('Нужно минимум 2 обычные утки для объединения.');
            }
        }

        function showToast(msg) {
            alert(msg);
        }

        // ---------- КЛИК ПО УТКЕ ----------
        function clickDuck() {
            if (energy <= 0) return;
            let gain = clickMultiplier;
            coins += gain;
            energy--;

            if (Math.random() < 0.1) {
                eggs++;
                showToast('🥚 Вы нашли яйцо! Зайдите во вкладку "Яйца"');
            }

            updateUI();
            saveToServer();

            const duck = document.getElementById('duck');
            duck.style.transform = 'scale(0.87)';
            setTimeout(() => { duck.style.transform = ''; }, 70);
        }

        // ---------- ВОССТАНОВЛЕНИЕ ЭНЕРГИИ ----------
        setInterval(() => {
            if (energy < MAX_ENERGY) {
                energy = Math.min(MAX_ENERGY, energy + 1);
                updateUI();
                saveToServer();
            }
        }, 2000);

        // ---------- ЗАДАНИЕ: ПОДПИСКА ----------
        document.getElementById('subscribeBtn')?.addEventListener('click', () => {
            if (tasks.subscribe) return;
            const channelLink = 'https://t.me/duck_farm_channel';
            window.open(channelLink, '_blank');
            setTimeout(() => {
                if (confirm('Подписались? Нажмите ОК для получения награды')) {
                    tasks.subscribe = true;
                    energy = Math.min(MAX_ENERGY, energy + 30);
                    updateUI();
                    saveToServer();
                    alert('🎉 +30 энергии!');
                }
            }, 3000);
        });

        // ---------- МАГАЗИН ----------
        document.getElementById('buyEnergyBtn')?.addEventListener('click', () => {
            const price = 25;
            if (coins >= price && energy < MAX_ENERGY) {
                coins -= price;
                energy = Math.min(MAX_ENERGY, energy + 20);
                updateUI();
                saveToServer();
            } else if (energy >= MAX_ENERGY) {
                alert('Энергия полная');
            } else {
                alert(`Не хватает ${price} монет`);
            }
        });

        document.getElementById('buyMultiplierBtn')?.addEventListener('click', () => {
            const price = 150;
            if (coins >= price && clickMultiplier === 1) {
                coins -= price;
                clickMultiplier = 2;
                updateUI();
                saveToServer();
                alert('🔥 Множитель x2 куплен навсегда!');
            } else if (clickMultiplier > 1) {
                alert('У вас уже есть множитель');
            } else {
                alert(`Нужно ${price} монет`);
            }
        });

        document.getElementById('buyEggBtn')?.addEventListener('click', () => {
            const price = 50;
            if (coins >= price) {
                coins -= price;
                eggs++;
                updateUI();
                saveToServer();
                alert('🥚 Яйцо добавлено в инкубатор!');
            } else {
                alert(`Нужно ${price} монет`);
            }
        });

        document.getElementById('mergeDucksBtn')?.addEventListener('click', mergeDucks);
        document.getElementById('dailyBonusBtn')?.addEventListener('click', claimDailyBonus);

        // ---------- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ----------
        const tabs = document.querySelectorAll('.tab-btn');
        const panels = {
            tap: document.getElementById('tapPanel'),
            eggs: document.getElementById('eggsPanel'),
            ducks: document.getElementById('ducksPanel'),
            shop: document.getElementById('shopPanel')
        };

        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.dataset.tab;
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                Object.values(panels).forEach(panel => {
                    if (panel) panel.classList.remove('active');
                });
                if (tabId === 'tap') panels.tap?.classList.add('active');
                if (tabId === 'eggs') panels.eggs?.classList.add('active');
                if (tabId === 'ducks') panels.ducks?.classList.add('active');
                if (tabId === 'shop') panels.shop?.classList.add('active');
            });
        });

        document.getElementById('duck').addEventListener('click', clickDuck);
        startPassiveIncome();
        loadFromServer();
    </script>
</body>

</html>
