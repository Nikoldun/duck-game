<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🦆 Утиная ферма</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1a7f3e 0%, #0a4a1f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            font-family: system-ui;
        }

        .game-container {
            max-width: 550px;
            width: 100%;
            background: #fef5e6;
            border-radius: 48px;
            padding: 16px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            background: #2d2b1f;
            border-radius: 60px;
            padding: 8px 16px;
            margin-bottom: 16px;
            color: #ffd966;
            font-weight: bold;
        }

        .stat {
            background: #1e1c15;
            padding: 5px 15px;
            border-radius: 40px;
            font-size: 1.1rem;
        }

        .duck-area {
            text-align: center;
            margin: 10px 0;
        }

        .duck {
            font-size: 150px;
            cursor: pointer;
            transition: transform 0.08s linear;
            display: inline-block;
        }

        .duck:active {
            transform: scale(0.92);
        }

        .energy-bar {
            background: #3a2c1c;
            border-radius: 30px;
            height: 14px;
            width: 90%;
            margin: 10px auto;
            overflow: hidden;
        }

        .energy-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f7b42c, #fcff6e);
            transition: width 0.1s linear;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin: 15px 0 10px;
        }

        .tab-btn {
            flex: 1;
            background: #e8dcc8;
            border: none;
            padding: 10px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-btn.active {
            background: #f5b642;
            color: white;
        }

        .panel {
            display: none;
            background: #fdf8e7;
            border-radius: 32px;
            padding: 12px;
            margin-top: 8px;
            max-height: 320px;
            overflow-y: auto;
        }

        .panel.active {
            display: block;
        }

        .item-card {
            background: #fff1da;
            border-radius: 24px;
            padding: 10px 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            background: #f5b642;
            border: none;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
        }

        button:active {
            transform: translateY(2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .badge {
            background: #f5cd94;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.75rem;
        }

        footer {
            text-align: center;
            font-size: 0.65rem;
            margin-top: 12px;
            color: #8b6b3a;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="stats">
            <div class="stat">🪙 <span id="score">0</span></div>
            <div class="stat">⚡ <span id="energyVal">100</span></div>
            <div class="stat">🐣 <span id="eggCount">0</span></div>
        </div>

        <div class="duck-area">
            <div class="duck" id="duck">🦆</div>
            <div class="energy-bar">
                <div class="energy-fill" id="energyFill"></div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="tap">🚀 Тапалка</button>
            <button class="tab-btn" data-tab="eggs">🥚 Яйца</button>
            <button class="tab-btn" data-tab="ducks">🦆 Утки</button>
            <button class="tab-btn" data-tab="shop">🏪 Магазин</button>
        </div>

        <div id="tapPanel" class="panel active">
            <div class="item-card" id="task-subscribe">
                <span>📢 Подписаться на канал</span>
                <button id="subscribeBtn">➕ +30 энергии</button>
            </div>
            <div class="item-card" id="dailyBonusCard">
                <span>🎁 Ежедневный бонус</span>
                <button id="dailyBonusBtn">Забрать</button>
            </div>
            <div id="bonusInfo"></div>
            <div class="passive-info">💰 Пассивный доход: <span id="passiveIncome">0</span> монет/сек</div>
        </div>

        <div id="eggsPanel" class="panel">
            <div id="eggsList"></div>
        </div>

        <div id="ducksPanel" class="panel">
            <div id="ducksList"></div>
            <button id="mergeDucksBtn" style="width:100%; margin-top:10px;">🔄 Объединить 2 обычных утки → 🦢
                Редкая</button>
        </div>

        <div id="shopPanel" class="panel">
            <div class="item-card"><span>🍎 +20 энергии</span><button id="buyEnergyBtn">25 🪙</button></div>
            <div class="item-card"><span>⚡ Множитель x2</span><button id="buyMultiplierBtn">150 🪙</button></div>
            <div class="item-card"><span>🥚 Яйцо</span><button id="buyEggBtn">50 🪙</button></div>
        </div>
        <footer>Кликай по утке | Шанс яйца — 10%</footer>
    </div>

    <script>
        (function () {
            if (!window.Telegram?.WebApp) {
                document.body.innerHTML = '<div style="padding:20px;text-align:center;">❌ Откройте в Telegram</div>';
                return;
            }
            const webApp = window.Telegram.WebApp;
            webApp.ready();
            webApp.expand();
            const user = webApp.initDataUnsafe?.user;
            if (!user?.id) {
                document.body.innerHTML = '<div style="padding:20px;text-align:center;">❌ Ошибка ID</div>';
                return;
            }
            const telegramId = user.id.toString();
            console.log('✅ ID:', telegramId);

            let coins = 0, energy = 100, clickMultiplier = 1, eggs = 0;
            let ducks = { common: 0, rare: 0 };
            let tasks = { subscribe: false };
            let bonusStreak = 0;
            const MAX_ENERGY = 100;

            async function loadFromServer() {
                try {
                    const res = await fetch(`/api/player/${telegramId}`);
                    const data = await res.json();
                    coins = data.coins; energy = data.energy; clickMultiplier = data.clickMultiplier;
                    eggs = data.eggs; ducks = data.ducks; tasks = data.tasks;
                    bonusStreak = data.bonusStreak;
                    updateUI();
                } catch (e) { console.error(e); }
            }
            async function saveToServer() {
                await fetch(`/api/player/${telegramId}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ coins, energy, clickMultiplier, eggs, ducks, tasks })
                });
            }

            function updateUI() {
                document.getElementById('score').innerText = Math.floor(coins);
                document.getElementById('energyVal').innerText = Math.floor(energy);
                document.getElementById('eggCount').innerText = eggs;
                document.getElementById('energyFill').style.width = (energy / MAX_ENERGY) * 100 + '%';
                document.getElementById('duck').innerText = energy <= 0 ? '😴' : (clickMultiplier > 1 ? '🐔⚡' : '🦆');
                const passive = ducks.common * 0.2 + ducks.rare * 0.8;
                document.getElementById('passiveIncome').innerText = passive.toFixed(1);
                const subBtn = document.getElementById('subscribeBtn');
                if (tasks.subscribe) { subBtn.disabled = true; subBtn.innerText = '✅ Выполнено'; }
                else { subBtn.disabled = false; subBtn.innerText = '➕ +30 энергии'; }
                document.getElementById('bonusInfo').innerHTML = `🔥 Серия: ${bonusStreak} дней | Завтра: ${50 + bonusStreak * 10} монет`;
                renderEggsPanel();
                renderDucksPanel();
            }
            function renderEggsPanel() {
                const container = document.getElementById('eggsList');
                if (eggs === 0) { container.innerHTML = '<div class="item-card">🥚 Нет яиц</div>'; return; }
                container.innerHTML = `<div class="item-card"><span>🥚 Яйцо x${eggs}</span><button id="hatchBtn">🐣 Вылупить</button></div>`;
                document.getElementById('hatchBtn')?.addEventListener('click', () => {
                    if (eggs <= 0) return;
                    eggs--;
                    const isRare = Math.random() < 0.2;
                    if (isRare) { ducks.rare++; alert('✨ Редкая утка!'); }
                    else { ducks.common++; alert('🐥 Обычная утка'); }
                    updateUI(); saveToServer();
                });
            }
            function renderDucksPanel() {
                const container = document.getElementById('ducksList');
                let html = '';
                if (ducks.common > 0) html += `<div class="item-card"><span>🦆 Обычная x${ducks.common}</span><span class="badge">+${(ducks.common * 0.2).toFixed(1)}/сек</span></div>`;
                if (ducks.rare > 0) html += `<div class="item-card"><span>🦢 Редкая x${ducks.rare}</span><span class="badge">+${(ducks.rare * 0.8).toFixed(1)}/сек</span></div>`;
                if (ducks.common === 0 && ducks.rare === 0) html = '<div class="item-card">🐤 Нет уток</div>';
                container.innerHTML = html;
            }

            function clickDuck() {
                if (energy <= 0) return;
                coins += clickMultiplier;
                energy--;
                if (Math.random() < 0.1) { eggs++; alert('🥚 Яйцо найдено!'); }
                updateUI(); saveToServer();
                const duck = document.getElementById('duck');
                duck.style.transform = 'scale(0.87)';
                setTimeout(() => duck.style.transform = '', 70);
            }
            setInterval(() => {
                if (energy < MAX_ENERGY) { energy++; updateUI(); saveToServer(); }
            }, 2000);

            document.getElementById('duck').addEventListener('click', clickDuck);
            document.getElementById('buyEnergyBtn')?.addEventListener('click', () => {
                if (coins >= 25 && energy < MAX_ENERGY) { coins -= 25; energy = Math.min(MAX_ENERGY, energy + 20); updateUI(); saveToServer(); }
                else alert(energy >= MAX_ENERGY ? 'Энергия полная' : 'Нужно 25 монет');
            });
            document.getElementById('buyMultiplierBtn')?.addEventListener('click', () => {
                if (coins >= 150 && clickMultiplier === 1) { coins -= 150; clickMultiplier = 2; updateUI(); saveToServer(); alert('🔥 Множитель x2'); }
                else alert('Нужно 150 монет');
            });
            document.getElementById('buyEggBtn')?.addEventListener('click', () => {
                if (coins >= 50) { coins -= 50; eggs++; updateUI(); saveToServer(); alert('🥚 +1 яйцо'); }
                else alert('Нужно 50 монет');
            });
            document.getElementById('subscribeBtn')?.addEventListener('click', () => {
                if (tasks.subscribe) return;
                window.open('https://t.me/duck_farm_channel', '_blank');
                setTimeout(() => {
                    if (confirm('Подписались?')) { tasks.subscribe = true; energy = Math.min(MAX_ENERGY, energy + 30); updateUI(); saveToServer(); alert('🎉 +30 энергии'); }
                }, 3000);
            });
            document.getElementById('dailyBonusBtn')?.addEventListener('click', async () => {
                const res = await fetch(`/api/daily-bonus/${telegramId}`, { method: 'POST' });
                const data = await res.json();
                if (data.success) { coins += data.reward; bonusStreak = data.streak; updateUI(); saveToServer(); alert(`🎉 +${data.reward} монет! Серия: ${data.streak}`); }
                else alert(data.message);
            });
            document.getElementById('mergeDucksBtn')?.addEventListener('click', () => {
                if (ducks.common >= 2) { ducks.common -= 2; ducks.rare++; alert('🔄 Объединение! +1 редкая'); updateUI(); saveToServer(); }
                else alert('Нужно 2 обычные утки');
            });

            const tabs = document.querySelectorAll('.tab-btn');
            const panels = { tap: document.getElementById('tapPanel'), eggs: document.getElementById('eggsPanel'), ducks: document.getElementById('ducksPanel'), shop: document.getElementById('shopPanel') };
            tabs.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabId = btn.dataset.tab;
                    tabs.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    Object.values(panels).forEach(p => p?.classList.remove('active'));
                    panels[tabId]?.classList.add('active');
                });
            });

            loadFromServer();
        })();
    </script>
</body>

</html>
