<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🦆 Проверка ID</title>
    <!-- 1. Скрипт WebApp (обязательно!) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
    <h2>Telegram ID Checker</h2>
    <p id="status">⏳ Инициализация...</p>
    <p id="user-id"></p>

    <script>
        // 2. Дожидаемся полной загрузки DOM
        document.addEventListener('DOMContentLoaded', () => {
            const statusP = document.getElementById('status');
            const userIdP = document.getElementById('user-id');

            // 3. Проверяем, появился ли Telegram.WebApp
            if (window.Telegram && window.Telegram.WebApp) {
                const webApp = window.Telegram.WebApp;
                webApp.ready();      // сообщаем, что приложение готово
                webApp.expand();     // растягиваем на весь экран

                // 4. Безопасно достаём user
                const userData = webApp.initDataUnsafe?.user;
                if (userData && userData.id) {
                    const userId = userData.id;
                    statusP.innerHTML = '✅ Telegram WebApp найден!';
                    userIdP.innerHTML = `🆔 Ваш ID: <strong>${userId}</strong>`;
                    console.log('ID пользователя:', userId);
                } else {
                    statusP.innerHTML = '⚠️ Telegram WebApp есть, но нет данных о пользователе.';
                    userIdP.innerHTML = 'Попробуйте открыть через кнопку меню бота.';
                }
            } else {
                statusP.innerHTML = '❌ Telegram WebApp не обнаружен.';
                userIdP.innerHTML = 'Убедитесь, что вы открыли игру через Telegram (кнопка Menu).';
            }
        });
    </script>
</body>

</html>
